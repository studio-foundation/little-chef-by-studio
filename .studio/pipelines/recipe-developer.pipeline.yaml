name: recipe-developer
description: Research, develop and validate a complex recipe from a brief
version: 2

stages:
  - name: culinary-research
    kind: research
    agent: culinary-researcher
    contract: culinary-research
    ralph:
      max_attempts: 3
    context:
      include:
        - input

  - name: ingredient-sourcing
    kind: research
    agent: ingredient-specialist
    contract: ingredient-sourcing
    ralph:
      max_attempts: 3
    context:
      include:
        - input
        - previous_stage_output

  - name: nutritional-profile
    kind: analysis
    agent: nutritionist
    contract: nutritional-profile
    ralph:
      max_attempts: 3
    context:
      include:
        - input
        - previous_stage_output # était: all_stage_outputs — nutritionist n'a besoin que des ingrédients

  - group: recipe-refinement
    max_iterations: 3 # était: 4 — 3 suffisent, la 4e itération coûte cher pour peu de gain
    stages:
      - name: recipe-drafting
        kind: creation
        agent: recipe-writer
        contract: recipe-output
        ralph:
          max_attempts: 3 # était: 5 — réduit les retry coûteux
        context:
          include:
            - input
            - all_stage_outputs
            - group_feedback
        tools:
          required:
            - db-upsert_recipe

      - name: technique-validation
        kind: qa
        agent: culinary-critic
        contract: technique-validations
        ralph:
          max_attempts: 2 # était: 3 — la validation est binaire, 2 tentatives suffisent
        context:
          include:
            - previous_stage_output
            - group_feedback